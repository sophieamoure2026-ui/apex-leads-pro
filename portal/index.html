<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Buyer Login — Apex Leads Pro</title>
<link rel="canonical" href="https://apexleads.biz/portal/"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:48px;max-width:440px;width:100%}
.logo{font-size:20px;font-weight:800;margin-bottom:8px}.logo span{color:#3b6ef5}
h1{font-size:24px;font-weight:800;margin-bottom:8px}
.sub{font-size:14px;color:#94a3b8;margin-bottom:28px}
label{font-size:13px;font-weight:600;color:#94a3b8;display:block;margin-bottom:6px}
input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:13px 16px;color:#fff;font-size:15px;font-family:inherit;outline:none;margin-bottom:16px}
input:focus{border-color:#3b6ef5}
button{width:100%;background:#1a4fd8;color:#fff;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
button:hover{background:#1239a8}
.note{font-size:12px;color:#64748b;text-align:center;margin-top:16px;line-height:1.6}
.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:#64748b;text-decoration:none}
#sent{display:none;text-align:center}
#sent .ok{font-size:48px;margin-bottom:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Apex<span>Leads</span> Pro</div>
  <div id="form">
    <h1>Buyer Portal</h1>
    <p class="sub">Enter the email you purchased with. We'll send your secure login link.</p>
    <label>Purchase email</label>
    <input type="email" id="email" placeholder="you@company.com"/>
    <button onclick="sendLink()">Send Login Link →</button>
    <p class="note">No password to remember. The link expires in 24 hours.<br/>New here? <a href="https://apexleads.biz/#pricing" style="color:#3b6ef5">Try 1 lead for $20</a></p>
  </div>
  <div id="sent">
    <div class="ok">📬</div>
    <h1>Check your inbox</h1>
    <p class="sub">Login link sent. It expires in 24 hours.</p>
  </div>
  <a href="https://apexleads.biz/" class="back">← Back to site</a>
</div>
<script>
function sendLink(){
  var e = document.getElementById('email').value;
  if(!e || e.indexOf('@') < 0){ alert('Enter a valid email'); return; }
  document.getElementById('form').style.display = 'none';
  document.getElementById('sent').style.display = 'block';
}
</script>
</body>
</html>
